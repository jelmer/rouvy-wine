name: container

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository_owner }}/rouvy
  WINE_BASE_IMAGE: ${{ github.repository_owner }}/rouvy-wine-base

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build the wine-base image. BuildKit's registry cache keeps Wine
      # compilation cached across runs, so this is fast when the submodule
      # and apt pins have not moved. On PRs we only verify it builds; the
      # rouvy stage below runs against the last published :latest.
      - name: Build wine-base
        uses: docker/build-push-action@v6
        with:
          context: .
          file: container/Containerfile.wine-base
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.REGISTRY }}/${{ env.WINE_BASE_IMAGE }}:latest
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.WINE_BASE_IMAGE }}:buildcache
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0}/{1}:buildcache,mode=max', env.REGISTRY, env.WINE_BASE_IMAGE) || '' }}

      - name: Compute image tags
        id: tags
        run: |
          image="${REGISTRY}/${IMAGE}"
          ref="${GITHUB_REF#refs/*/}"
          short_sha="${GITHUB_SHA::7}"
          tags=""
          add() { tags="${tags:+$tags,}$1"; }
          case "$GITHUB_REF" in
            refs/tags/*)
              add "$image:$ref"
              add "$image:latest"
              ;;
            refs/heads/*)
              add "$image:sha-$short_sha"
              [ "$ref" = main ] && add "$image:main"
              ;;
            refs/pull/*)
              add "$image:pr-${{ github.event.number }}"
              ;;
          esac
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - name: Build rouvy
        uses: docker/build-push-action@v6
        with:
          context: .
          file: container/Containerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            WINE_BASE=${{ env.REGISTRY }}/${{ env.WINE_BASE_IMAGE }}:latest
